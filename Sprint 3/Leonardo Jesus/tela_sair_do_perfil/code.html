<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Deslogar - MaPUC</title>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mapuc: {
              navy: '#123B5D',
              teal: '#34B7A7',
              bg: '#F8FAFC',
              card: '#FFFFFF',
              textPrimary: '#172554',
              textSecondary: '#64748B',
              danger: '#E04F5F',
              dangerLight: '#FEE2E2',
              border: '#E2E8F0'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
<style data-purpose="custom-enhancements">
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex justify-center antialiased">
<!-- Mobile Screen Frame Container (390px - 428px standard iOS width) -->
<main class="w-full max-w-md bg-[#F8FAFC] min-h-screen flex flex-col justify-between shadow-2xl relative border-x border-slate-100">
<!-- BEGIN: TopHeader -->
<header class="bg-white border-b border-slate-200/80 sticky top-0 z-30 px-4 pt-4 pb-3.5 shadow-sm">
<div class="flex items-center justify-between">
<div class="flex items-center space-x-3">
<!-- Botão Voltar -->
<button aria-label="Voltar para o perfil" class="w-10 h-10 -ml-1.5 flex items-center justify-center rounded-full text-mapuc-navy hover:bg-slate-100 active:scale-95 transition-all" type="button">
<svg class="w-6 h-6 stroke-current stroke-[2.2]" fill="none" viewBox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Título da Tela -->
<div>
<h1 class="text-xl font-bold tracking-tight text-mapuc-navy">Deslogar</h1>
</div>
</div>
</div>
</header>
<!-- END: TopHeader -->
<!-- BEGIN: ContentArea -->
<section class="flex-1 px-5 pt-6 pb-4 flex flex-col justify-between" data-purpose="logout-confirmation-container">
<div class="space-in-between flex flex-col items-center">
<!-- BEGIN: StudentProfileSummaryCard -->
<!-- User summary card reflecting current session info from SCREEN_3 -->
<article class="w-full bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm flex items-center gap-4 mb-8" data-purpose="user-info-card">
<!-- Circular Student Avatar with Initials -->
<div class="relative flex-shrink-0">
<div class="w-16 h-16 rounded-full bg-gradient-to-tr from-[#0F304E] to-[#1D5482] text-white flex items-center justify-center font-bold text-xl tracking-wider shadow-inner">
              LA
            </div>
<div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-emerald-500 border-2 border-white flex items-center justify-center" title="Sessão Ativa">
<span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
</div>
</div>
<!-- Student Meta Information -->
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2 mb-0.5">
<h2 class="text-base font-bold text-slate-800 truncate">
                Lucas Silveira de Alencar
              </h2>
</div>
<p class="text-xs text-slate-500 font-medium flex items-center gap-1.5 mb-1">
<svg class="w-3.5 h-3.5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<rect height="14" rx="2" stroke-width="2" width="18" x="3" y="5"></rect>
<path d="M7 15h4M7 9h2" stroke-linecap="round" stroke-width="2"></path>
</svg>
<span class="">Matrícula: <strong class="text-slate-700 font-semibold">2110482</strong></span>
</p>
<span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-slate-100 text-slate-600">
              Engenharia de Computação
            </span>
</div>
</article>
<!-- END: StudentProfileSummaryCard -->
<!-- BEGIN: ConfirmationMessageBlock -->
<div class="w-full text-center px-2">
<!-- Warning / Logout Visual Indicator -->
<div class="w-14 h-14 mx-auto mb-4 rounded-2xl bg-red-50 text-red-500 border border-red-100 flex items-center justify-center">
<svg class="w-7 h-7 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Main confirmation question directly from wireframe -->
<h3 class="text-lg font-bold text-slate-900 mb-2">
            Tem certeza que deseja sair da sua conta?
          </h3>
<p class="text-sm text-slate-500 leading-relaxed max-w-xs mx-auto">Você será desconectado e precisará informar seu cadastro e senha para acessar o MaPUC novamente.</p>
</div>
<!-- END: ConfirmationMessageBlock -->
</div>
<!-- BEGIN: ActionButtons -->
<!-- Interactive logout action and return action buttons -->
<footer class="w-full space-y-3 pt-6 pb-6" data-purpose="action-group">
<!-- Main Exit Action Button -->
<button class="w-full h-12 bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-semibold rounded-xl text-base shadow-sm shadow-red-200 flex items-center justify-center gap-2 transition-all" type="button">
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="">Sair</span>
</button>
<!-- Secondary Cancel Action Button -->
<button class="w-full h-12 bg-white hover:bg-slate-100 active:bg-slate-200 text-slate-700 font-medium rounded-xl text-base border border-slate-300/80 transition-all" type="button">Cancelar</button>
</footer>
<!-- END: ActionButtons -->
</section>
<!-- END: ContentArea -->
<!-- Safe area spacing indicator for iOS Home Indicator -->
<div aria-hidden="true" class="h-4 w-full"></div>
</main>


</body></html>
