<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Dados do Perfil - MaPUC</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mapuc: {
              navy: '#123B5D',      // Azul MaPUC
              teal: '#49C5B6',      // Verde-água de destaque
              tealHover: '#3eb0a2', // Hover do verde-água
              lightBlue: '#4FA3D1',  // Azul Claro institucional
              bg: '#F8FAFC',        // Fundo cinza suave
              border: '#E2E8F0',    // Bordas sutis
              dark: '#1E293B',      // Tipografia primária
              muted: '#64748B'      // Tipografia secundária/labels
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          boxShadow: {
            'card': '0 4px 20px -2px rgba(18, 59, 93, 0.06)',
            'cta': '0 8px 20px -4px rgba(73, 197, 182, 0.45)',
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Mobile Specifics -->
<style data-purpose="mobile-layout">
    body {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .safe-top {
      padding-top: env(safe-area-inset-top, 0px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
  </style>
</head>
<body class="bg-slate-100 flex justify-center items-start min-h-screen font-sans antialiased text-mapuc-dark">
<!-- BEGIN: MobileDeviceContainer -->
<!-- Container configurado para o padrão de visualização mobile de 390px -->
<div class="w-full max-w-[390px] min-h-screen bg-mapuc-bg flex flex-col shadow-2xl relative">
<!-- BEGIN: TopBar -->
<!-- Barra superior com botão de voltar e navegação institucional -->
<header class="bg-white border-b border-mapuc-border sticky top-0 z-30 px-4 pt-4 pb-3.5 shadow-sm">
<div class="flex items-center justify-between">
<div class="flex items-center space-x-3">
<!-- Botão Voltar -->
<button aria-label="Voltar para a página anterior" class="w-10 h-10 -ml-1.5 flex items-center justify-center rounded-full text-mapuc-navy hover:bg-slate-100 active:scale-95 transition-all" type="button">
<svg class="w-6 h-6 stroke-current stroke-[2.2]" fill="none" viewBox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Título da Tela -->
<div>
<h1 class="text-xl font-bold tracking-tight text-mapuc-navy">Dados do perfil</h1>
</div>
</div>
<!-- Badge institucional PUC-Rio -->

</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: MainContent -->
<main class="flex-1 px-4 py-5 space-y-5 overflow-y-auto">
<!-- BEGIN: UserAvatarSection -->
<!-- Foto de identificação rápida e botão para alterar foto -->
<section class="flex flex-col items-center justify-center pt-1 pb-2">
<div class="relative group">
<!-- Círculo do Avatar com Iniciais PUC -->
<div class="w-20 h-20 rounded-full bg-gradient-to-tr from-mapuc-navy to-mapuc-lightBlue flex items-center justify-center text-white text-2xl font-bold shadow-md ring-4 ring-white">
<span class="">LA</span>
</div>
<!-- Botão de atalho para câmera / foto -->
<button aria-label="Alterar foto de perfil" class="absolute bottom-0 right-0 bg-mapuc-teal text-white p-1.5 rounded-full shadow-md hover:bg-mapuc-tealHover transition-colors" type="button">
<svg class="w-4 h-4 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
<path d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<button class="mt-2 text-xs font-semibold text-mapuc-lightBlue hover:underline tracking-tight" type="button">
          Alterar foto do perfil
        </button>
</section>
<!-- END: UserAvatarSection -->
<!-- BEGIN: ProfileForm -->
<form class="space-y-4" id="dados-perfil-form" onsubmit="event.preventDefault();">
<!-- Campo 1: Nome -->
<div class="space-y-1.5" data-purpose="field-nome">
<label class="block text-sm font-semibold text-mapuc-dark" for="nome">
            Nome
          </label>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-mapuc-muted">
<svg class="w-5 h-5 stroke-current stroke-[1.8]" fill="none" viewBox="0 0 24 24">
<path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="block w-full rounded-xl border border-mapuc-border bg-white pl-11 pr-3.5 py-3 text-sm font-medium text-mapuc-dark focus:border-mapuc-navy focus:ring-1 focus:ring-mapuc-navy placeholder:text-gray-400 transition" id="nome" name="nome" placeholder="Digite seu nome completo" type="text" value="Lucas Silveira de Alencar">
</div>
</div>
<!-- Campo 2: Matrícula -->
<div class="space-y-1.5" data-purpose="field-matricula">
<div class="flex justify-between items-center">
<label class="block text-sm font-semibold text-mapuc-dark" for="matricula">
              Matrícula
            </label>
<span class="text-[11px] text-mapuc-muted font-medium">Somente leitura</span>
</div>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-mapuc-muted">
<svg class="w-5 h-5 stroke-current stroke-[1.8]" fill="none" viewBox="0 0 24 24">
<path d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5zm6-10.125a1.875 1.875 0 11-3.75 0 1.875 1.875 0 013.75 0zm1.294 6.336a6.721 6.721 0 01-3.17.789 6.721 6.721 0 01-3.168-.789 3.376 3.376 0 016.338 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="block w-full rounded-xl border border-mapuc-border bg-slate-100 pl-11 pr-3.5 py-3 text-sm font-medium text-slate-600 focus:outline-none cursor-not-allowed select-none" id="matricula" name="matricula" readonly="" type="text" value="2110482">
</div>
</div>
<!-- Campo 3: Curso -->
<div class="space-y-1.5" data-purpose="field-curso">
<label class="block text-sm font-semibold text-mapuc-dark" for="curso">
            Curso
          </label>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-mapuc-muted">
<svg class="w-5 h-5 stroke-current stroke-[1.8]" fill="none" viewBox="0 0 24 24">
<path d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="block w-full rounded-xl border border-mapuc-border bg-white pl-11 pr-3.5 py-3 text-sm font-medium text-mapuc-dark focus:border-mapuc-navy focus:ring-1 focus:ring-mapuc-navy placeholder:text-gray-400 transition" id="curso" name="curso" placeholder="Digite o curso" type="text" value="Engenharia de Computação">
</div>
</div>
<!-- Campo 4: E-mail -->
<div class="space-y-1.5" data-purpose="field-email">
<label class="block text-sm font-semibold text-mapuc-dark" for="email">
            E-mail
          </label>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-mapuc-muted">
<svg class="w-5 h-5 stroke-current stroke-[1.8]" fill="none" viewBox="0 0 24 24">
<path d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="block w-full rounded-xl border border-mapuc-border bg-white pl-11 pr-3.5 py-3 text-sm font-medium text-mapuc-dark focus:border-mapuc-navy focus:ring-1 focus:ring-mapuc-navy placeholder:text-gray-400 transition" id="email" name="email" placeholder="seu.nome@aluno.puc-rio.br" type="email" value="lucas.alencar@aluno.puc-rio.br">
</div>
</div>
<!-- BEGIN: PasswordActionSection -->
<!-- Seção de Senha separada com botão secundário funcional -->
<div class="pt-2 space-y-1.5" data-purpose="section-senha">
<label class="block text-sm font-semibold text-mapuc-dark">
            Senha
          </label>
<!-- Botão Secundário Interativo 'Alterar senha' -->
<button class="w-full flex items-center justify-between px-4 py-3.5 rounded-xl border border-mapuc-lightBlue/30 bg-sky-50/70 hover:bg-sky-100 active:bg-sky-200/80 transition group shadow-sm" id="btn-alterar-senha" type="button">
<div class="flex items-center space-x-3">
<div class="w-8 h-8 rounded-lg bg-sky-100 text-mapuc-lightBlue flex items-center justify-center group-hover:bg-mapuc-lightBlue group-hover:text-white transition">
<svg class="w-4 h-4 stroke-current stroke-2" fill="none" viewBox="0 0 24 24">
<path d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div class="text-left">
<span class="block text-sm font-semibold text-mapuc-navy">Alterar senha</span>
<span class="block text-xs text-mapuc-muted">Atualizada há 3 meses</span>
</div>
</div>
<svg class="w-5 h-5 text-mapuc-lightBlue group-hover:translate-x-0.5 transition-transform stroke-current stroke-2" fill="none" viewBox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- END: PasswordActionSection -->
</form>
<!-- END: ProfileForm -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomCTA -->
<!-- Botão principal de ação "Salvar alterações", com Verde-água (#49C5B6) destacado -->
<footer class="p-4 bg-white/95 backdrop-blur-sm border-t border-mapuc-border safe-bottom sticky bottom-0 z-20">
<button class="w-full h-12 bg-mapuc-teal hover:bg-mapuc-tealHover active:scale-[0.99] text-white font-bold text-base tracking-wide rounded-xl shadow-cta flex items-center justify-center space-x-2 transition-all duration-150" form="dados-perfil-form" id="btn-salvar" type="submit">
<svg class="w-5 h-5 stroke-current stroke-[2.2]" fill="none" viewBox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="">Salvar alterações</span>
</button>
</footer>
<!-- END: BottomCTA -->
</div>
<!-- END: MobileDeviceContainer -->
<!-- Interatividade sutil de feedback no salvamento -->
<script data-purpose="form-actions">
    document.getElementById('btn-salvar').addEventListener('click', function() {
      const originalText = this.innerHTML;
      this.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Salvando...</span>
      `;
      setTimeout(() => {
        this.innerHTML = `
          <svg class="w-5 h-5 text-white stroke-current stroke-[2.5]" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
          </svg>
          <span>Alterações salvas!</span>
        `;
        setTimeout(() => {
          this.innerHTML = originalText;
        }, 2000);
      }, 700);
    });
  </script>


</body></html>
