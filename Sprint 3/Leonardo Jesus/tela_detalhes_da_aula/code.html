<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Detalhes da aula - MaPUC</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mapuc: {
              navy: '#123B5D',
              lightBlue: '#4FA3D1',
              teal: '#49C5B6',
              tealDark: '#3bb3a4',
              bg: '#F8FAFC',
              border: '#E2E8F0',
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style data-purpose="base-layout">
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen text-slate-800 antialiased p-0 sm:p-4">
<!-- Mobile Screen Container (iPhone / Mobile iOS dimension) -->
<main class="w-full max-w-[402px] min-h-screen sm:min-h-[844px] bg-[#F8FAFC] flex flex-col shadow-xl sm:rounded-[36px] overflow-hidden border border-slate-200/80">
<!-- BEGIN: TopBar -->
<!-- Status bar safe area padding for iOS -->
<header class="bg-white border-b border-slate-100 px-6 pt-5 pb-4 flex items-center gap-4 sticky top-0 z-20" data-purpose="screen-header">
<button aria-label="Voltar para a lista de aulas" class="w-10 h-10 -ml-1 rounded-full flex items-center justify-center text-mapuc-navy hover:bg-slate-100 active:scale-95 transition-all" type="button">
<!-- Back Arrow Icon -->
<svg class="w-6 h-6 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="text-xl font-bold text-mapuc-navy tracking-tight">Detalhes da aula</h1>
</header>
<!-- END: TopBar -->
<!-- BEGIN: ContentArea -->
<div class="flex-1 px-5 py-6 flex flex-col gap-5 overflow-y-auto" data-purpose="screen-body">
<!-- Course Header Card -->
<section aria-label="Informações da disciplina" class="bg-white rounded-2xl p-5 border border-mapuc-border shadow-[0_2px_8px_rgba(0,0,0,0.03)]">

<!-- Discipline Title -->
<h2 class="text-lg font-bold text-slate-900 leading-snug tracking-tight">
          PROJETO INTEGRADO - SOFTWARE
        </h2>
</section>
<!-- Details List Card -->
<section aria-label="Especificações da turma e local" class="bg-white rounded-2xl p-5 border border-mapuc-border shadow-[0_2px_8px_rgba(0,0,0,0.03)] flex flex-col divide-y divide-slate-100">
<!-- Horário -->
<div class="py-3.5 first:pt-0 flex items-start gap-3.5">
<div class="w-10 h-10 rounded-xl bg-blue-50 text-mapuc-lightBlue flex items-center justify-center shrink-0 mt-0.5">
<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle cx="12" cy="12" r="10"></circle>
<polyline points="12 6 12 12 16 14"></polyline>
</svg>
</div>
<div>
<p class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Horário</p>
<p class="text-sm font-semibold text-slate-800 mt-0.5">Sexta-feira, 11:00 - 13:00</p>
</div>
</div>
<!-- Turma -->
<div class="py-3.5 flex items-start gap-3.5">
<div class="w-10 h-10 rounded-xl bg-cyan-50 text-mapuc-lightBlue flex items-center justify-center shrink-0 mt-0.5">
<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 016 18.719m12 0a5.971 5.971 0 00-.941-3.197m0 0A5.995 5.995 0 0012 12.75a5.995 5.995 0 00-5.058 2.772m0 0a3 3 0 00-4.681 2.72 8.986 8.986 0 003.74.477m.94-3.197a5.971 5.971 0 00-.94 3.197M15 6.75a3 3 0 11-6 0 3 3 0 016 0zm6 3a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0zm-13.5 0a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<p class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Turma</p>
<p class="text-sm font-semibold text-slate-800 mt-0.5">33C</p>

</div>
<!-- Professor -->
<div class="py-3.5 flex items-start gap-3.5">
<div class="w-10 h-10 rounded-xl bg-slate-100 text-mapuc-navy flex items-center justify-center shrink-0 mt-0.5">
<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<p class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Professor</p>
<p class="text-sm font-semibold text-slate-800 mt-0.5">Luís Fernando Bicalho</p>
</div>
</div>
<!-- Sala -->
<div class="py-3.5 last:pb-0 flex items-start gap-3.5">
<div class="w-10 h-10 rounded-xl bg-teal-50 text-mapuc-tealDark flex items-center justify-center shrink-0 mt-0.5">
<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<p class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Sala</p>
<div class="flex items-center gap-2 mt-0.5">
<span class="text-sm font-bold text-slate-900">LIENG</span>
<span class="text-xs text-slate-500 font-medium">(Laboratório de Informática)</span>
</div>
</div>
</div>
</section>
<!-- Primary Action CTA -->
<div class="pt-2">
<button class="w-full bg-mapuc-teal hover:bg-mapuc-tealDark active:scale-[0.98] text-white font-semibold text-base py-3.5 px-4 rounded-xl shadow-sm transition-all duration-150 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-mapuc-teal" type="button">
<!-- Route / Navigation Icon -->
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
</svg>
<span class="">Ver rota até a sala</span>
</button>
</div>
</div>
<!-- END: ContentArea -->
<!-- Safe area spacing for iOS home indicator -->
<div class="h-6 w-full shrink-0"></div>
</main>
