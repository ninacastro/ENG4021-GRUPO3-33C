<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>MaPUC - Login</title>
<!-- Tailwind CSS v3 CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            puc: {
              navy: '#0C2340',
              deep: '#0E2D58',
              teal: '#2A9D8F',
              tealDark: '#1E7C70',
              tealLight: '#E6F4F2',
              bg: '#F8FAFC',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 font-sans min-h-screen flex items-center justify-center p-0 sm:p-4 text-slate-800 antialiased selection:bg-teal-100 selection:text-puc-navy">
<!-- BEGIN: MobileContainer -->
<!-- Main wrapper mimicking iOS viewport dimensions (390px x 844px style) -->
<main class="w-full max-w-[420px] bg-white min-h-screen sm:min-h-[844px] sm:max-h-[890px] sm:rounded-[44px] shadow-2xl overflow-hidden flex flex-col justify-between border-slate-200/80 sm:border relative" data-purpose="mobile-viewport">
<!-- BEGIN: iOSStatusBar -->
<!-- Authentic iOS status bar indicator -->
<header class="w-full pt-3 px-7 pb-1 flex justify-between items-center text-slate-800 text-xs font-semibold z-20" data-purpose="ios-status-bar">
<span class="">09:41</span>
<div class="flex items-center space-x-2">
<!-- Signal Strength Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.54-.5 2.97-1.35 4.14L12 19.53l-5.65-3.39C5.5 14.97 5 13.54 5 12c0-3.87 3.13-7 7-7z"></path>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.32c3.54 0 6.77 1.34 9.21 3.54L12 19.98 2.79 10.86C5.23 8.66 8.46 7.32 12 7.32z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-slate-800 rounded-sm p-0.5 flex items-center">
<div class="w-full h-full bg-slate-800 rounded-[1px]"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- Scrollable container for the form content -->
<div class="flex-1 flex flex-col px-6 pt-3 pb-6 justify-between overflow-y-auto">
<!-- Top Branding Section -->
<div>
<!-- BEGIN: BrandHeader -->
<div class="flex flex-col items-center text-center mt-2 mb-6" data-purpose="brand-header">
<!-- Logo Image Container -->
<div class="w-full max-w-[240px] px-2 py-1 flex items-center justify-center mx-auto">
<img alt="MaPUC Logo - Encontre seu caminho na PUC-Rio" class="w-full h-auto object-contain max-h-36 mx-auto" src="https://lh3.googleusercontent.com/aida/AEtjO1VKqYg09JB_7QXwIQHR3Qi2McNIswhNau9J5qIhGo3xChRylH-SbgKuardj9D_y_0QqBJAZeuajUJFOgc5PT-zJRsSBOCJTszRLmXELr2J6849SLCsOmpXwO0-PUTN4d23RzGDY3XGnm5QiINAivQ96-0JjVlEEJwGMUm3135-7iSr_Z8anBdXGU4a5wXTqTS5CwMK_f5zP8jvR6KEfmDigrdkgNKqnqytdY32yu8KRY-crzyNOGgoaX6xp">
</div>
<!-- Subtitle / Welcome description -->
<p class="text-xs text-slate-500 font-medium mt-1 tracking-tight">
            Acesse com as credenciais acadêmicas da PUC-Rio
          </p>
</div>
<!-- END: BrandHeader -->
<!-- BEGIN: LoginForm -->
<!-- Faithful implementation of the hand-drawn wireframe form -->
<form class="space-y-4" data-purpose="login-form" onsubmit="event.preventDefault();">
<!-- Field 1: Cadastro / Matrícula (Wireframe: 'Cadastro' with 'TEXTO SIMPLES') -->
<div class="space-y-1.5" data-purpose="input-group-user">
<div class="flex justify-between items-center">
<label class="block text-sm font-bold text-puc-navy" for="user-identity">
                Cadastro
              </label>
<span class="text-[11px] font-medium text-slate-400">Matrícula / E-mail</span>
</div>
<div class="relative rounded-xl border border-slate-300 bg-slate-50/50 focus-within:bg-white focus-within:border-puc-teal focus-within:ring-2 focus-within:ring-puc-teal/20 transition-all duration-200">
<!-- Prefix Icon -->
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"></path>
</svg>
</div>
<input class="w-full pl-11 pr-4 py-3 bg-transparent text-sm text-slate-900 placeholder-slate-400 border-0 focus:ring-0 focus:outline-none" id="user-identity" name="identity" placeholder="Ex: 2410849 ou aluno@puc-rio.br" type="text">
</div>
</div>
<!-- Field 2: Senha (Wireframe: 'Senha' with masked dots & toggle icon) -->
<div class="space-y-1.5" data-purpose="input-group-password">
<div class="flex justify-between items-center">
<label class="block text-sm font-bold text-puc-navy" for="password">
                Senha
              </label>
</div>
<div class="relative rounded-xl border border-slate-300 bg-slate-50/50 focus-within:bg-white focus-within:border-puc-teal focus-within:ring-2 focus-within:ring-puc-teal/20 transition-all duration-200">
<!-- Lock Icon -->
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"></path>
</svg>
</div>
<input class="w-full pl-11 pr-11 py-3 bg-transparent text-sm text-slate-900 tracking-wider placeholder-slate-400 border-0 focus:ring-0 focus:outline-none" id="password" name="password" type="password" value="secretpassword">
<!-- Visibility Eye-slash Toggle Button (As prominently drawn in wireframe) -->
<button aria-label="Alternar visibilidade da senha" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-puc-navy transition-colors focus:outline-none" type="button">
<!-- Slashed Eye icon matching wireframe glyph -->
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"></path>
</svg>
</button>
</div>
</div>
<!-- Primary CTA Button -->
<div class="pt-2">
<button class="w-full bg-puc-navy hover:bg-puc-deep text-white font-semibold py-3.5 px-4 rounded-xl shadow-md hover:shadow-lg active:scale-[0.99] transition-all duration-150 flex items-center justify-center space-x-2" type="submit">
<span class="">Acessar Mapa</span>
<!-- Navigation Direction Arrow -->
<svg class="w-4 h-4 text-puc-teal" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
</div>
</form>
<!-- END: LoginForm -->
<!-- BEGIN: ExternalNavigationLinks -->
<!-- Direct match for the wireframe's two distinct external action links -->
<div class="mt-6 pt-4 border-t border-slate-100 space-y-2.5" data-purpose="secondary-actions">
<!-- Link 1: Esqueceu sua senha? with external box icon -->
<a class="group flex items-center justify-between p-2.5 rounded-xl hover:bg-slate-50 text-slate-700 hover:text-puc-navy transition-colors text-sm font-medium" href="#recuperar-senha">
<span class="flex items-center space-x-2">
<span class="w-1.5 h-1.5 rounded-full bg-slate-300 group-hover:bg-puc-teal transition-colors"></span>
<span class="">Esqueceu sua senha?</span>
</span>
<!-- External Box / Link Arrow Icon as sketched in wireframe -->
<span class="flex items-center text-slate-400 group-hover:text-puc-teal transition-colors">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</span>
</a>
<!-- Link 2: Não tem cadastro? with external box icon -->
<a class="group flex items-center justify-between p-2.5 rounded-xl bg-puc-tealLight/50 hover:bg-puc-tealLight text-puc-tealDark transition-colors text-sm font-semibold border border-puc-teal/20" href="#cadastro-inicial">
<span class="flex items-center space-x-2">
<svg class="w-4 h-4 text-puc-teal" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="">Não tem cadastro?</span>
</span>
<!-- External Box / Link Arrow Icon matching sketch -->
<span class="flex items-center text-puc-teal">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</span>
</a>
</div>
<!-- END: ExternalNavigationLinks -->
</div>
<!-- BEGIN: CampusWayfindingFooter -->
<!-- Micro-copy matching the MaPUC system design standards -->
<footer class="mt-8 text-center" data-purpose="system-footer">
<div class="inline-flex items-center justify-center space-x-1.5 text-[11px] text-slate-400 font-medium">
<span class="">Campus Wayfinding PUC-Rio</span>
<span class="">•</span>
<span class="">Prédios, Laboratórios e Salas</span>
</div>
<!-- iOS Home Indicator Bar -->
<div class="w-32 h-1 bg-slate-200 rounded-full mx-auto mt-4"></div>
</footer>
<!-- END: CampusWayfindingFooter -->
</div>
</main>
<!-- END: MobileContainer -->


</body></html>
