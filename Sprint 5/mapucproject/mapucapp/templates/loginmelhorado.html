{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MaPUC</title>
    <link rel="stylesheet" href="{% static 'css/loginmelhorado.css' %}">
</head>

<body>

    <div class="container-celular">

        <div class="imagem-logo">
            <img src="https://i.ibb.co/bYRTmJ7/logopuc.png" alt="Logo MaPUC">
        </div>

        <h1>MaPUC</h1>

        <h2>Tela de início</h2>
        <h3>Acesse com sua matrícula</h3>

<div>
    <form action="/inicio/" method="POST">
    {% csrf_token %}
    
    {{ form.email }}
    {{ form.senha }}
    
    <button href="/inicio/" type="submit" class="botao-login">Entrar</button>
</form>
</div>

        <button type="button">Esqueci minha senha</button>
        <button type="button">Não tenho cadastro</button>

    </div>

</body>
</html>
