{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alterar Dados - MaPUC</title>
    <link rel="stylesheet" href="{% static 'css/alterar-dados.css' %}">
</head>
<body>
    <div class="container-celular">

        <header class="cabecalho">
            <a class="voltar" href="{% url 'perfil' %}">← Voltar</a>
            <h1>ALTERAR DADOS</h1>
        </header>

        {% if messages %}
            <div class="mensagens" role="status">
                {% for message in messages %}
                    <p class="mensagem {{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="avatar" aria-hidden="true">
                {{ perfil.nome|slice:":2"|upper }}
            </div>

            <p class="centro">
                <a href="#">Alterar foto do perfil</a>
            </p>

            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome"
                       value="{{ perfil.nome }}"
                       autocomplete="name" required>
            </div>

            <div class="campo">
                <label for="matricula">Matrícula <span class="dica">(somente leitura)</span></label>
                <input type="text" id="matricula"
                       value="{{ perfil.matricula }}" readonly>
            </div>

            <div class="campo">
                <label for="curso">Curso</label>
                <input type="text" id="curso" name="curso"
                       value="{{ perfil.curso }}" required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email"
                       value="{{ perfil.email }}"
                       autocomplete="email" required>
            </div>

            <div class="campo">
                <span class="rotulo">Senha</span>
                <a class="cartao-senha" href="#"> <!-- troque pelo {% url 'nome_da_url' %} -->
                    <div>
                        <strong>Alterar senha</strong>
                        <span class="dica">Atualizada há 3 meses</span>
                    </div>
                    <span class="seta" aria-hidden="true">›</span>
                </a>
            </div>

            <button type="submit" class="botao-salvar">Salvar alterações</button>
        </form>

    </div>
</body>
</html>
