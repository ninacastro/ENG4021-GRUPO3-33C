{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MaPUC{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}?v=3">
    {% block styles %}{% endblock %}
    {% block head_scripts %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <header class="mapuc-topbar">
        <span class="mapuc-topbar__back-slot">
            {% block back_link %}{% endblock %}
        </span>
        <span class="mapuc-topbar__brand">
            <img class="mapuc-topbar__logo" src="{% static 'images/logo-mapuc.png' %}" alt="">
            <span>MaPUC</span>
        </span>
        <a class="mapuc-topbar__profile" href="{% url 'perfil' %}" aria-label="Meu perfil">{{ aluno_iniciais|default:"?" }}</a>
    </header>
    <div class="mapuc-topbar-spacer" aria-hidden="true"></div>

    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
