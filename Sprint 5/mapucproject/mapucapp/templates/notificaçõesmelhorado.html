{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <title>MaPUC - Avisos</title>

    <link rel="stylesheet" href="{% static 'css/notificacoesmelhorado.css' %}" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
      
        <a href="/inicio/" style="text-decoration: none;">
            <button class="voltar">←</button>
        </a>
        <h1>Avisos e Recados</h1>
      </div>
      <button class="marcar-tudo">Marcar tudo</button>
    </header>

    <div class="conteudo">
      <div class="area-notificacoes">

        {% if notificacoes %}
        

            {% for aviso in notificacoes %}
                <div class="card-notificacao">
                    <h3>{{ aviso.titulo }}</h3>
                    <p>{{ aviso.mensagem }}</p>
                    <small>{{ aviso.data_criacao }}</small>
                </div>
            {% endfor %}
            
        {% else %}
            <p>Você não tem novas notificações no momento.</p>
        {% endif %}
      </div>
    </div>

    <footer class="rodape">
      <a href="/inicio/" class="rodape-item" style="text-decoration: none; color: inherit;">MAPA</a>
      <a href="/grade/" class="rodape-item" style="text-decoration: none; color: inherit;">HORÁRIO</a>
    </footer>
  </body>
</html>
